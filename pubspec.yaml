name: elsmasets_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Default Flutter dependency - iOS style icons
  cupertino_icons: ^1.0.8

  # Flutter localization support (dates, languages, etc.)
  flutter_localizations:
    sdk: flutter

  # Custom dependencies

  # Allows controlling the desktop app window (size, position, title bar)
  window_manager: ^0.5.1

  # Retrieves screen information (resolution, scale factor) for desktop
  screen_retriever: ^0.2.0

  # Full-featured calendar widget with event markers and custom builders
  table_calendar: ^3.1.2

  # Interactive charts and graphs (line, bar, pie charts)
  fl_chart: ^0.70.0
  
  # HTTP client for making REST API calls to the backend
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lint rules for good Flutter/Dart coding practices
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:    
    - assets/masets_blanco.png
  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/arial.ttf